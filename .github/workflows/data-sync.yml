name: 干员数据自动同步

# 每天 15:15 与 03:15 (UTC+8) = 07:15 / 19:15 UTC 各检测一次上游 Kengxxiao/ArknightsGameData；
# 有新增可获取干员则自动追加到 server/characters.json + src/data/characters.json 并推 main。
# 推送用 secrets.ACTIONS_PAT（与本人 push 等价）→ 自动触发 deploy.yml（后端 VPS）+ Cloudflare Pages（前端）。
# 数据是 append-only 追加，不重排已有行（保证每日挑战 seed 索引稳定）。
#
# 🔴 2026-11-01：从「每天一次」改成「每天两次」。原因不是脚本坏了，是 **GitHub 的 schedule 会推迟**：
#    实测 07:15 UTC 的 cron 连续一周都在 13:12~14:20 UTC 才真正触发（推迟约 6 小时），
#    期间如果上游恰好更新，站点就要多等一天。加一个 19:15 UTC 的窗口把最大等待砍半；
#    无变更时脚本 10 秒短路退出，多跑一次几乎零成本（公开仓库 Actions 免费）。
#    注意：GitHub 也可能整个跳过某次 schedule —— 两次是冗余，不是保证。
on:
  schedule:
    - cron: '15 7 * * *'    # 15:15 UTC+8
    - cron: '15 19 * * *'   # 次日 03:15 UTC+8
  workflow_dispatch: {}    # 手动触发: Actions → 干员数据自动同步 → Run workflow

permissions:
  contents: write

# 数据写入只在 main 串行执行，避免两个并发 bot 互相覆盖
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false   # 不留下 checkout token；push 用下方 ACTIONS_PAT

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查上游并同步
        run: python scripts/auto-update.py --apply

      - name: 自检（两文件一致性 + schema）
        run: python scripts/auto-update.py --validate

      - name: 提交并推送（仅当确有变更）
        env:
          ACTIONS_PAT: ${{ secrets.ACTIONS_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "✓ 上游无新干员，无变更可提交"
            exit 0
          fi
          if [ -z "${ACTIONS_PAT:-}" ]; then
            echo "::error::缺少 secrets.ACTIONS_PAT —— 请到 repo Settings → Secrets and variables → Actions 添加"
            echo "::error::值取本地 ~/.git-credentials-nym 中 :后面的 github_pat_/ghp_ token（需有该仓库 contents:write）"
            exit 1
          fi
          git config user.name "Arknights Data Sync"
          git config user.email "data-sync@users.noreply.github.com"
          git add -A server/characters.json src/data/characters.json .github/
          git commit -m "chore(data): 干员 roster 自动同步 $(date -u +%F)"
          git push "https://x-access-token:${ACTIONS_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "✅ 已推送 main（触发后端部署 + 前端构建）"
