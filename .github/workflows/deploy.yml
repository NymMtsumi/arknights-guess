name: 自动部署到 VPS

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'                 # 图标等静态资源直接进产物，改了必须过哨兵
      - 'package.json'
      - 'package-lock.json'
      # ⚠️ 构建配置必须列进来：改了它们同样会被 Cloudflare Pages 构建上线，
      #    但漏在这里 = 本 workflow 根本不触发 = **两道 gate 全部绕过**。
      #    历史漏项就是这一组（next.config / tsconfig / postcss）。
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.mjs'
      - '.github/workflows/**'      # gate 自身的改动也要过一次（改错了能立刻发现）
      # 全模块测试横跨前后端：src/** 变更也跑冒烟（集成校验），
      # 但只有 server/** 变更才真正触发后端部署（见 deploy job 的 paths-filter）。
  workflow_dispatch:

# 防止并发部署导致 git/npm 竞态
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ── 前置 gate：全模块冒烟测试（跑通 checklist 才允许部署）──
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 全模块冒烟测试（认证/管理/单人/多人/派对）
        run: bash scripts/smoke-all.sh

  # ── 静态审查 gate：类型 + 服务端语法（共同开发者直接推送也强制过）──
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 前端类型检查
        run: npx tsc --noEmit

      - name: 服务端语法检查
        run: find server -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: 干员数据一致性检查
        # server/characters.json 与 src/data/characters.json 必须字节一致（手动改动也拦）
        run: node scripts/check-characters.mjs

      - name: V12 选择器哨兵
        # v12.css 的应用层选择器必须保持 html[data-ui="v12"] .ui-v12；
        # 被简化成 .ui-v12 会因特异性打平而整块静默失效（不报错），故机器把关
        run: node scripts/check-v12-selector.mjs

      - name: i18n 键哨兵
        # 两份语言文件的键集合必须一致（缺一边 = 该语言下直接显示原始键名）；
        # 顺带报出死键。只加了脚本没接进 CI 的话，等于没加。
        run: node scripts/check-i18n-keys.mjs

  # ── 部署（仅在冒烟 + 审查通过 + 有服务端变更时；手动触发则强制部署）──
  deploy:
    needs: [smoke, review]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检测服务端变更
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'
              - 'package.json'
              - 'package-lock.json'

      - name: 触发 VPS 部署
        if: steps.changes.outputs.server == 'true' || github.event_name == 'workflow_dispatch'
        env:
          # Domain dependency: ws.arknights-guess.online → VPS nginx → Node :3001
          # Override via vars.DEPLOY_WEBHOOK_URL in repo settings if domain changes
          DEPLOY_WEBHOOK_URL: ${{ vars.DEPLOY_WEBHOOK_URL || 'https://ws.arknights-guess.online/api/deploy' }}
        run: |
          curl -fsS --retry 3 --max-time 30 -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"${{ secrets.DEPLOY_TOKEN }}\"}" \
            || { echo "::error::Deploy webhook failed"; exit 1; }
          echo ""
          echo "✅ 部署触发完成"
