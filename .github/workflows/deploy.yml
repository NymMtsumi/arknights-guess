name: 自动部署到 VPS

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'package.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 触发 VPS 部署
        run: |
          curl -s -X POST http://160.236.110.37:3001/api/deploy \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"${{ secrets.DEPLOY_TOKEN }}\"}"
          echo ""
          echo "✅ 部署触发完成"
