# 443 SSL 代理
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/liyiba.crt;
    ssl_certificate_key /etc/nginx/ssl/liyiba.key;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

# 80 普通代理 (Cloudflare Worker 用)
server {
    listen 80;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
