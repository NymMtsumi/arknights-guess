        # 安全：清空客户端伪造的代理头，再从可信来源设置
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP $remote_addr;
        # 不转发客户端声称的 CF-Connecting-IP（防伪造）
        proxy_set_header CF-Connecting-IP "";
    }
}
